name: study03_task1_sigma06_fluid
description: "Task 1: independent z+/z- forcing calibration, fluid-only RMHD"

grid:
  Nx: 64
  Ny: 64
  Nz: 32
  Lx: 1.0
  Ly: 1.0
  Lz: 1.0

physics:
  v_A: 1.0
  eta: 2.0
  nu: 0.0
  beta_i: 1.0
  Lambda: 2.236
  hyper_r: 2
  hyper_n: 1

initial_condition:
  type: zero
  amplitude: 0.0
  alpha: 1.667
  k_min: 1.0
  k_max: 10.0
  k_wave: [0.0, 0.0, 1.0]
  M: 0

forcing:
  enabled: true
  amplitude: 0.002
  k_min: 1.0
  k_max: 2.0
  seed: 3106
  mode: imbalanced_elsasser_lowkz
  target_sigma_c: 0.6
  max_nz: 1
  include_nz0: false
  correlation: 0.0

time_integration:
  n_steps: 1  # task runner advances to target_outer_times, not n_steps
  cfl_safety: 0.3
  save_interval: 1

io:
  output_dir: studies/03-stochastic-echo/data/task1_forcing_gate
  save_spectra: true
  save_energy_history: true
  save_fields: false
  save_final_state: false
  overwrite: false

study3_forcing_gate:
  target_outer_times: 12.0
  averaging_outer_times: 10.0
  sample_interval_outer_times: 0.25
  sigma_tolerance: 0.05
  max_high_k_fraction: 0.01
