# m_* against beta_i (Anjor 2026-11-10: plots of m_* against beta_i and chi to back m_* ~ beta_i/chi^2): forced KRMHD
# at beta_i = 0.3 with M = 192, otherwise as forced_beta0p3_m64.yaml.  At M = 64 the fit spans only 0.84 e-folds of
# exp(-sqrt(2m)/ell_*) (ell_* = 7.2); a fit over 1.5 e-folds from sqrt(2m) = 2 needs sqrt(M) >= 2 + 1.5 ell_*, i.e.
# M >= ~165, below the collisional range m > M/2.
# Read by scripts/run_forced_turbulence.py (on Modal with scripts/modal_chain.py); analysis by analysis/h1_fieldlines.py
# and analysis/h1_pilot.py.
#
# Changes from forced_beta0p3_m64.yaml:
#  * M = 192, nu = 30 sqrt(32/192) sqrt(beta_i): keeps the total collisional attenuation of the M = 32 runs
#    (nu ~ sqrt(beta_i/M)) with the sink at m > M/2 = 96.  u_max = 19.0.
#  * Snapshots every 10 tau_A.
# Everything else (box, forcing and seeds, hyper-resistivity, Alfvenic hand-off from the spin-up, g = 0 at t = 0, time
# step rule, t_end 66 with the window t = 16..66) is the same as in forced_beta0p3_m64.yaml.

label: forced-beta0p3-m192

box:
  L: 1.0
  N: 64

velocity:
  M: 192
  Lambda: "-1 + 10/3 + sqrt(4 + 100/9)"
  beta_i: 0.3
  closure: zero

stepper:
  scheme: lawson_rk4
  eta: 300.0
  hyper_r: 2
  nu: "30*sqrt(1/6)*sqrt(0.3)"
  hyper_n: 6
  eta_z: 0.0
  hyper_rz: 1
  closure: zero

forcing:
  alfven:
    eps: 0.3
    generator: perp_lowkz
    n_min: 1
    n_max: 2
    max_nz: 1
    include_nz0: false
    seed: 20261015
  density:
    eps: 0.3
    generator: perp_lowkz
    n_min: 1
    n_max: 2
    max_nz: 1
    include_nz0: false
    seed: 20261016

init:
  type: file
  path: paper/phase-velocity-slices/data/P1_forced-spinup64_20261015_110112/restart.npz
  keep_g: false
  keep_time: false
  keep_keys: false

time:
  t_end: 66.0                  # gate window (the final 50 tau_A) t = 16..66, as at M = 64
  dt_max: 5.0e-3
  dt_rule: exact
  safety: 0.8
  safety_alfven: 0.4          # Alfvenic CFL limit (the slice-advection limit keeps 0.8)
  recompute_every: 25
  limit_every: 1               # rescale both limits every step (h1lib.make_fast_limits)
  sample_every: 20
  print_every: 500
  snapshot_every: 10.0
  restart_every: 2.0

diagnostics:
  n_outer: 2

analysis:
  fieldlines:
    n_lines: 4096
    z_len: 4.0
    dz: 0.0078125              # 1/128
    kperp_bands: [[0, 2], [2, 4], [4, 8], [8, 16]]
    slices_u: [0.0, 1.0, -1.0, 2.0, -2.0, 3.0]
    n_forcing_draws: 4

gates:
  steady_window: 50.0
  steady_tol: 0.15
  balance_tol: 0.05
  conservation_tol: 0.01
  resolution_tol: 1.0e-3
  m_tol: 0.01
