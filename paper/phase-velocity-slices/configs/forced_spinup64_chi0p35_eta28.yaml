# Calibration of the hyper-resistivity for the chi ~ 0.34 run at beta_i = 0.05 (Anjor 2026-11-11, option B: rerun at
# chi ~ 0.34 with a smaller eta).  The run P1_forced-beta0p05-chi0p35-m512_20261110_200914 (eta = 109.375 = 300 x 0.35/0.96)
# failed the E_A slope test (-6.55): its hyper-resistive dissipation sat at median shell 7 (quartiles 6-9), against 10 (7-13)
# at chi ~ 0.96 and 9 at chi ~ 0.75 and 0.56.  Target: dissipation median at shell 9-10.
#
# As forced_spinup64_chi0p35b.yaml (64^3, M = 2, eps_A = 0.005, no density forcing; z+- do not depend on g or beta_i),
# except:
#  * eta = 28 (one of 28, 40, 56, run side by side).  With eta proportional to chi the median moved from shell 10 to 7
#    between chi 0.96 and 0.345, as weak turbulence predicts: at the forcing k_par the cascade rate is ~ chi^2 omega_A
#    k_perp/k_1 for E_A ~ k_perp^-2, and eta (k_perp/k_max)^4 balances it at k_d^3 ~ chi^2/eta, so k_d ~ chi^(1/3) at
#    eta ~ chi (10 x (0.345/0.96)^(1/3) = 7.1).  Keeping k_d needs eta ~ chi^2: 300 x (0.345/0.96)^2 = 39; 28 and 56
#    bracket it by sqrt(2).
#  * Starts from the end (t = 330) of the chi ~ 0.34 production run, whose outer scales are in steady state at this
#    eps_A (z+- only); runs 100 tau_A, measures over the second half (scratch spinup_check.py / spec_compare.py:
#    chi_out, E_A trend, dissipation median shell).
#
# Units: v_A = 1, box side L = 1 (k = 2 pi n), tau_A = L_z/v_A = 1.

label: forced-spinup64-chi0p35-eta28

box:
  L: 1.0
  N: 64

velocity:
  M: 2
  Lambda: sqrt5
  beta_i: 1.0
  closure: zero

stepper:
  scheme: lawson_rk4
  eta: 28.0                     # damping rate eta (k_perp^2/k_perp,max^2)^r on z+- and every g_m
  hyper_r: 2
  nu: 0.0
  hyper_n: 6
  eta_z: 0.0
  hyper_rz: 1
  closure: zero

forcing:
  alfven:
    eps: 0.005
    generator: perp_lowkz
    n_min: 1
    n_max: 2
    max_nz: 1
    include_nz0: false
    seed: 20261015
  density:
    eps: 0.0                   # off during the Alfvenic spin-up
    generator: perp_lowkz
    n_min: 1
    n_max: 2
    max_nz: 1
    include_nz0: false
    seed: 20261016

init:
  type: file
  path: /results/p1-mstar/beta0p05-chi0p35-m512/P1_forced-beta0p05-chi0p35-m512_20261110_200914/restart.npz
  keep_g: false
  keep_time: false
  keep_keys: false

time:
  t_end: 100.0                  # tau_A
  dt_max: 5.0e-3
  dt_umax_M: 32
  dt_rule: bound
  safety: 0.8
  recompute_every: 25
  sample_every: 20
  print_every: 500
  snapshot_every: 10.0
  restart_every: 2.0

diagnostics:
  n_outer: 2

gates:
  steady_window: 50.0
  steady_tol: 0.10
  balance_tol: 0.05
  conservation_tol: 0.01
  resolution_tol: 1.0e-3
  m_tol: 0.01
