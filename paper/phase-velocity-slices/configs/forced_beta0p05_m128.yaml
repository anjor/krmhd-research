# m_* against beta_i and against chi (Anjor 2026-11-10: plots of m_* against beta_i and chi to back
# m_* ~ beta_i/chi^2): forced KRMHD at beta_i = 0.05, M = 128, chi_out ~ 0.95.  The fourth point of the beta_i scan at
# fixed chi (with 0.1, 0.3, 1) and the chi ~ 1 point of the chi scan at beta_i = 0.05.  Expected m_* ~ 3 (ell_* ~ 2.4,
# from T/tau_nl ~ 15.9 beta_i^0.15 and kappa_1 = 1.13 k_1); beta_i = 0.05 keeps the break measurable at M = 128-256
# as chi falls, even if m_* grows as chi^-4.
# Read by scripts/run_forced_turbulence.py (on Modal with scripts/modal_chain.py); analysis by analysis/h1_fieldlines.py
# and analysis/h1_pilot.py.
#
# Changes from forced_beta0p1_m64.yaml:
#  * beta_i = 0.05, Lambda = Lambda^+ = 1/beta_i - 1 + sqrt(4 + 1/beta_i^2) = 19 + sqrt(404) = 39.10 (tau = Z = 1).
#  * M = 128, nu = 30 sqrt(32/128) sqrt(beta_i): keeps the total collisional attenuation of the M = 32 runs
#    (nu ~ sqrt(beta_i/M)) with the sink at m > M/2 = 64.  u_max = 15.4.
#  * t_end 180 with the gate window t = 20..180 (160 tau_A, four blocks of 40): the integrated correlation time of W
#    grew from 0.8 to 1.4 and 3.6 tau_A as beta_i fell from 1 to 0.3 and 0.1, and the block check needed ~28 of them;
#    ~5.6 tau_A is expected here.  The window is extended in place (--resume with a larger t_end) if W's correlation
#    time turns out longer.
#  * Snapshots every 20 tau_A.
# Everything else (box, forcing and seeds, hyper-resistivity, Alfvenic hand-off from the spin-up, g = 0 at t = 0, time
# step rule) is the same as in forced_beta0p1_m64.yaml.

label: forced-beta0p05-m128

box:
  L: 1.0
  N: 64

velocity:
  M: 128
  Lambda: "19 + sqrt(404)"
  beta_i: 0.05
  closure: zero

stepper:
  scheme: lawson_rk4
  eta: 300.0
  hyper_r: 2
  nu: "30*sqrt(0.25)*sqrt(0.05)"
  hyper_n: 6
  eta_z: 0.0
  hyper_rz: 1
  closure: zero

forcing:
  alfven:
    eps: 0.3
    generator: perp_lowkz
    n_min: 1
    n_max: 2
    max_nz: 1
    include_nz0: false
    seed: 20261015
  density:
    eps: 0.3
    generator: perp_lowkz
    n_min: 1
    n_max: 2
    max_nz: 1
    include_nz0: false
    seed: 20261016

init:
  type: file
  path: paper/phase-velocity-slices/data/P1_forced-spinup64_20261015_110112/restart.npz
  keep_g: false
  keep_time: false
  keep_keys: false

time:
  t_end: 180.0                 # gate window (the final 160 tau_A) t = 20..180
  dt_max: 5.0e-3
  dt_rule: exact
  safety: 0.8
  safety_alfven: 0.4          # Alfvenic CFL limit (the slice-advection limit keeps 0.8)
  recompute_every: 25
  limit_every: 1               # rescale both limits every step (h1lib.make_fast_limits)
  sample_every: 20
  print_every: 500
  snapshot_every: 20.0
  restart_every: 2.0

diagnostics:
  n_outer: 2

analysis:
  fieldlines:
    n_lines: 4096
    z_len: 4.0
    dz: 0.0078125              # 1/128
    kperp_bands: [[0, 2], [2, 4], [4, 8], [8, 16]]
    slices_u: [0.0, 1.0, -1.0, 2.0, -2.0, 3.0]
    n_forcing_draws: 4

gates:
  steady_window: 160.0
  steady_tol: 0.15
  balance_tol: 0.05
  conservation_tol: 0.01
  resolution_tol: 1.0e-3
  m_tol: 0.01
