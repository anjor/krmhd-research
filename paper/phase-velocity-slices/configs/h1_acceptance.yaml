# Gate decisions for the forced 64^3 H1 runs (scripts/run_forced_turbulence.py), as made by Anjor.  Read by
# analysis/h1_pilot.py, which re-evaluates each run's recorded gates with these settings and analyses the run only if
# every gate passes under them.  The run's own .json keeps the gates it recorded at run time; the analysis writes
# both to h1_analysis.json.

steady_state:
  # Anjor 2026-10-15, option (b): std/mean < 0.15 over the final 50 tau_A instead of 0.10 (the fluctuation of the
  # Alfvenic energy is intrinsic at this box size: 11.2% in the spin-up), plus a block-average convergence check.
  tol: 0.15
  n_blocks: 4                  # 4 x 12.5 tau_A over the 50 tau_A window
  # Block check: (max - min)/mean over the blocks of the time averages H1 uses, each divided by its block's measured
  # injection rate: W(m), the field-aligned flux and D_perp(m) for m <= 3M/4, D_nu(m) for m >= M/2 (where the
  # hypercollisional sink sits), and the collisional share of the free-energy dissipation.  The tolerance was chosen
  # in the analysis (Anjor asked for agreement between blocks and a report of the spread, without a number) and
  # confirmed by Anjor 2026-10-16 ("that 20% limit is reasonable").
  block_tol: 0.20
  decision: "Anjor 2026-10-15: option (b), 15% plus a block-average convergence check"

runs:
  P1_forced-beta1_20261015_122613:
    m_tol: 0.02
    decision: >-
      Anjor 2026-10-16: accept as a pilot with the Hermite-resolution limit (free energy at m > 3M/4) relaxed from 1%
      to 2% (measured 1.11%); a larger run later checks resolution
  P1_forced-beta0p3_20261016_145938:
    window: 37.5
    m_tol: 0.02
    decision: >-
      Anjor 2026-10-18, option (A): averaging window t = 15.5..53 (37.5 tau_A) because W and E_A were still settling
      during the first 12.5 tau_A of the 50 tau_A window (block means W 0.346 vs 0.41); Hermite-resolution limit 2% as
      for beta_i = 1 (measured 1.01%)
  P1_forced-beta0p1dt_20261016_234138:
    steady_tol: 0.20
    block_tol: 0.25
    decision: >-
      Anjor 2026-10-18, option (A): accepted as run; W std/mean 0.180 and block spreads up to 23% (W(m), D_nu) match the
      scatter expected from the 3.6 tau_A correlation time of W over 50 tau_A (no blow-up in the spectra); the block
      spreads are quoted as error bars.  Supersedes P1_forced-beta0p1_20261016_092043 (failed energy conservation)
  P1_forced-beta0p1-m64_20261018_144649:
    steady_tol: 0.20
    block_tol: 0.25
    decision: >-
      Anjor 2026-10-18, option (A) extended to the M = 64 runs: accepted as run, like its M = 32 counterpart
      (W std/mean 0.186, block spreads up to 21%, from the slow fluctuation of W at low beta_i; no blow-up); the block
      spreads are quoted as error bars
  P1_forced-beta0p3-m64_20261018_144656:
    steady_tol: 0.16
    decision: >-
      Anjor 2026-10-18, option (A) extended to the M = 64 runs: accepted with E_A std/mean 0.158 (limit 0.15); the
      block check of the averages used passes (largest spread 18.5%)
