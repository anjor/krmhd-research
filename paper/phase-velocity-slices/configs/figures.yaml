# Parameters of the computed figures of section 8 (deterministic computations, no time integration).
# Read by analysis/fig_spectrum.py and analysis/fig_dictionary.py.
# Each script caches its numbers in data/computed/<figure>.npz (with a .json of metadata and checks) and plots
# from the cache; it recomputes only when its section of this file changes or with --recompute.
#
# Conventions (paper section 2): v_A = 1, u = v_par/v_th, F_M(u) = exp(-u^2)/sqrt(pi), s = sqrt(beta_i),
# Hermite coefficients g_m as in GANDALF (krmhd 0.6.0), zero closure g_{M+1} = 0 unless stated; the copy closure
# g_{M+1} = g_{M-1} is GANDALF's "symmetric" closure. Box length L = 1, so k_z = 2 pi n_z.
# Lambda values may be numbers or the strings "sqrt5", "-sqrt5", "inf".
#
# Each "checks" block holds numbers printed by the self-checking scripts in derivations/ (their out/*.out files);
# the figure scripts recompute them and stop with exit status 1 if one disagrees beyond its tolerance.

style:
  single_width_in: 3.4          # JPP single column
  double_width_in: 7.0          # JPP double column
  font_size_pt: 10
  legend_font_size_pt: 8
  usetex: true
  palette: ["#0072B2", "#D55E00", "#009E73", "#E69F00", "#CC79A7"]   # Okabe-Ito, used in this fixed order
  reference_color: "#000000"
  png_dpi: 300

# -------------------------------------------------------------------------------------------------------------
# fig:spectrum. (a) spectral density rho(u) = F_M/|eps(u + i0)|^2, eps(zeta) = 1 - [1 + zeta Z(zeta)]/Lambda, with
# the Gauss weights of GANDALF's zero-closure ladder at M = 16 as lambda_j/Delta u_j at the nodes u_j;
# (b) the largest phase velocity u_max of GANDALF's ladder versus M for both closures, with the asymptotic forms
# (der-truncated eqs. 17-18; paper eq:umax).
spectrum:
  density:
    Lambda: [sqrt5, -sqrt5, inf]
    u_range: [-5.25, 5.25]
    n_u: 2101
    mass_quad_range: [-14.0, 14.0]   # int rho du is checked against Lambda/(Lambda - 1) over this range
  gauss:
    M: 16
    closure: zero
    window: 3.0                      # |u_j| < window for the reported max |lambda_j/(rho(u_j) Delta u_j) - 1|
  umax:
    Lambda: sqrt5
    closures: [zero, symmetric]
    M_min: 4
    M_max: 1024
    n_M: 40                          # log-spaced integer M (duplicates removed)
    n_curve: 400                     # points of the asymptotic curves
  checks:
    mass_tol: 1.0e-10                # derivations/continuum/out/s04_cvk_transform.out, C7
    gauss_dev:                       # derivations/continuum/out/s05_ladder_ops.out, L5, M = 16, |u| < 3
      Lambda: [sqrt5, -sqrt5]
      value: [8.16e-2, 1.81e-2]
      tol: 5.0e-4
    umax_table:                      # derivations/truncated/out/t2_eigenvalues.out, E (Lambda = sqrt5)
      M: [16, 32, 64, 65, 128, 129, 256]
      zero: [4.8713451936, 7.2538518220, 10.6160229819, 10.7052162579, 15.3550496747, 15.4180308291, 22.0362329610]
      symmetric: [5.3021461185, 7.6643235018, 11.0011563867, 11.0897459704, 15.7122781399, 15.7749385173,
                  22.3646981901]
      tol: 1.0e-9
    umax_asymptotics:                # t2_eigenvalues.out, F: three-term zero-closure formula and the remainder
      M_formula: [64, 128]           #   (u_max - three-term) nu^(3/2)
      formula: [10.616139, 15.355091]
      M_remainder: [64, 128, 1024]
      remainder_zero: [-0.173265, -0.171574, -0.169425]
      remainder_symmetric: [-0.146477, -0.145508, -0.144227]
      tol: 1.0e-6

# -------------------------------------------------------------------------------------------------------------
# fig:dictionary. (a) W(m) normalised by its large-m asymptote: delta-correlated slices with density F_M (exact
# Gamma(m+1/2)/(sqrt2 pi m!)) and Kanekar et al.'s forced-linear spectrum on GANDALF's ladder (white noise on g_0,
# streaming operator -i s k_z A with an outgoing closure at m = M, Lyapunov steady state; as in
# derivations/truncated/t4_dictionary.py, C2), together with the continuum spectrum of delta-correlated slices with
# density proportional to rho(u) at finite Lambda, W(m) = pi p_0 sqrt(2m) int rho phi_m^2 du in units of the asymptote,
# by Gauss quadrature of rho du on a K-point ladder (Golub-Welsch; exact at Lambda = inf to round-off);
# (b) local slope d ln W/d ln m for slice correlations chat(kappa) = (1 + kappa^2 ell^2)^(-p/2) with density F_M,
# W(m) = (1/pi) int_0^inf chat(kappa) exp(-kappa^2/2) (kappa^2/2)^m/m! dkappa (t4, D1, in closed form).
dictionary:
  delta:
    m_max: 400
  forced:
    M: 600
    Lambda: [inf, sqrt5, -sqrt5]
    kz: 6.283185307179586          # 2 pi
    s: 1.0
    m_plot_max: 400
    n_markers: 14                  # log-spaced markers on the forced curves
  continuum:
    Lambda: [inf, sqrt5, -sqrt5]
    K_gauss: 2000                  # nodes of the Gauss rule of rho du used for int rho phi_m^2 du, m <= m_plot_max
  powerlaw:
    p: [0.5, 1.0, 1.5, 2.0, 2.5]
    ell: [1.0, 0.15]
    m_min: 1.0
    m_max: 10000.0
    n_m: 161
    quad_epsrel: 1.0e-10
  checks:
    delta_large_m:                 # t4_dictionary.out, A2: pi sqrt(2m) Gamma(m+1/2)/(sqrt2 pi m!)
      m: [50, 200]
      value: [0.997503164, 0.9993751959]
      tol: 1.0e-9
    forced:                        # t4_dictionary.out, C2: W(m) |k| s sqrt(2m)/eps_W
      m: [1, 2, 4, 8, 16, 32, 64, 128, 200]
      Lambda: [inf, sqrt5, -sqrt5]
      value:
        - [0.8865, 0.9402, 0.9695, 0.9847, 0.9924, 0.9963, 0.9983, 0.9992, 0.9996]
        - [0.8445, 0.9150, 0.9560, 0.9777, 0.9889, 0.9945, 0.9973, 0.9987, 0.9992]
        - [0.9330, 0.9672, 0.9836, 0.9918, 0.9960, 0.9982, 0.9992, 0.9998, 1.0000]
      tol: 5.1e-5
      kanekar_max_rel_dev: 3.1e-4  # Lambda = inf against the exact (pi eps/|k|) Gamma(m+1/2)/(sqrt2 pi m!)
      kanekar_tol: 5.0e-6
    continuum:                     # computed here (no derivations/ output): quadrature exactness and closure error
      inf_tol: 1.0e-10             # Gauss-rule int F_M psi_m^2 du against Gamma(m+1/2)/(sqrt2 pi m!), m <= 400
      vs_forced_tol: 5.0e-4        # forced ladder (outgoing closure) against the continuum at m <= 200, every Lambda
    powerlaw:                      # t4_dictionary.out, D1: W(m)/[chat(sqrt2m)/(pi sqrt2m)] and the fitted slope
      m: [4, 8, 16, 32, 64, 128, 200, 300, 400]
      fit_m: [128, 200, 300, 400]
      rows:                        # [ell, p, ratios..., fitted slope]
        - [0.15, 0.5, 0.966, 0.982, 0.991, 0.995, 0.998, 0.999, 0.999, 1.000, 1.000, -0.726]
        - [0.15, 1.0, 0.962, 0.980, 0.990, 0.996, 0.998, 0.999, 1.000, 1.000, 1.000, -0.953]
        - [0.15, 1.5, 0.959, 0.978, 0.990, 0.996, 0.999, 1.000, 1.000, 1.000, 1.000, -1.180]
        - [0.15, 2.0, 0.957, 0.977, 0.990, 0.998, 1.001, 1.001, 1.001, 1.001, 1.001, -1.407]
        - [0.15, 2.5, 0.955, 0.976, 0.991, 1.000, 1.003, 1.003, 1.002, 1.002, 1.001, -1.635]
        - [1.0, 0.5, 0.971, 0.987, 0.994, 0.997, 0.999, 0.999, 1.000, 1.000, 1.000, -0.749]
        - [1.0, 1.0, 0.985, 0.996, 0.999, 1.000, 1.000, 1.000, 1.000, 1.000, 1.000, -0.999]
