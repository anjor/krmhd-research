# -------------------------------------------------------------------------------------------------------------
# fig:reflection. (a) exact revival ratio of |g_0(t)| near the recurrence time (collisional/collisionless maxima of
# the matrix exponential of GANDALF's linear operator L = -i s k_z A + nu D, D = -diag((m/M)^n), m >= 2) against
# the law R = exp(-X), X = 2 nu t_w/(2n+1), t_w = sqrt(2M)/(|k_z| s), over the scan of
# derivations/truncated/t6_reflection.py, C; (b) the forced steady state W_zero/W_open (white noise on g_0, Lyapunov
# solves with the zero closure and with an outgoing closure) against coth X with X from the exact revival (t6, D).
reflection:
  scan:
    Lambda: [inf, sqrt5]
    M: [32, 64, 128, 256]
    n: [2, 4, 6]
    nu: [0.3, 1.0, 3.0, 10.0, 30.0]
    nz: [1, 2, 4]                  # k_z = 2 pi n_z
    s: 1.0
    window: [0.8, 1.2]             # search window for the revival, in units of T_rec = 2 sqrt(2M+3)/(k_z s)
    n_t: 1601
    tail_at: 0.75                  # |g_0| at 0.75 T_rec bounds the non-recurrent response
    resolved_factor: 20.0          # a case is resolved if the collisional revival peak exceeds 20x that bound
  steady:
    M: 128
    n: 6
    nu: 3.0
    Lambda: sqrt5
    nz: 1
    s: 1.0
  checks:                          # derivations/truncated/out/t6_reflection.out
    n_cases: 360
    n_unresolved: 41
    n_unresolved_sqrt5: 39
    M_median: [32, 64, 128, 256]
    median_exponent_error: [0.1387, 0.0677, 0.0335, 0.0168]   # |ln(R_law/R_exact)|/X (C4)
    median_tol: 5.1e-5
    max_exponent_error_M128_X3: 0.050                         # M >= 128, X < 3 (C1)
    max_tol: 5.1e-4
    X: 1.1753                                                 # steady case (D)
    R_exact: 0.2913
    X_meas: 1.2335
    coth_X: 1.2107
    coth_X_meas: 1.1854
    ratio_m: [2, 4, 8, 16, 32, 48]
    ratio: [1.1852, 1.1852, 1.1852, 1.1854, 1.1865, 1.1911]
    steady_tol: 5.1e-5
