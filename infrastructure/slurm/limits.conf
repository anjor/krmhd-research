# Limits that cluster_submit.sh checks before every job: the first submission of a run and every automatic
# resubmission of a run that paused at the wall-time limit.  A job that breaks one is not submitted ('REFUSED: ...').
# Defaults until a GPU budget is agreed: one job at a time, one automatic resubmission per run, no weekly limit.

MAX_CONCURRENT_JOBS=1      # jobs named p1-* queued or running at once (the job that resubmits itself is not counted)
GPU_HOURS_PER_WEEK=        # GPU hours of the jobs submitted in the past 7 days, this one included (a job counts its
                           # time limit until it ends and its hours used after that); empty: no weekly limit yet
MAX_RESUBMITS_PER_RUN=1    # automatic resubmissions of one run after it pauses (exit status 3)
